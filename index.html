<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>AI Prompt Vault</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h1>🚀 AI Prompt Vault</h1>

        <input
            id="search"
            type="text"
            placeholder="Search prompts...">

        <hr>

        <input
            id="title"
            type="text"
            placeholder="Prompt Title">

        <input
            id="category"
            type="text"
            placeholder="Category">

        <textarea
            id="prompt"
            placeholder="Write your AI prompt here..."></textarea>

            <div class="stats">

    <span id="totalCount">Total: 0</span>

    <span id="favoriteCount">Favorites: 0</span>

</div>

<div class="toolbar">
    
    <select id="sortSelect">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="az">A - Z</option>
           <option value="za">Z - A</option>

    </select>

    <select id="categoryFilter">
        <option value="all">All Categories</option>
    </select>

    <button id="favoritesOnlyBtn">⭐ Favorites</button>

    <button id="exportBtn">Export</button>
        <button id="importBtn">Import</button>

        <input
           type="file"
            id="importFile"
            accept=".json"
            hidden>

</div>

    <div id="toast"></div>
    
        <button id="saveBtn">
            Save Prompt
        </button>

        <hr>

        <div id="promptList"></div>

    </div>

    <script src="popup.js"></script>

</body>

</html>
